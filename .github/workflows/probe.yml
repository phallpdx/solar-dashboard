name: Probe data sources

# Manual check of new data sources: saves the status and first part of each response
# to the "probe" branch so they can be inspected before writing a parser.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs"
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir out && cd out
          i=0
          for u in $URLS; do
            i=$((i+1))
            code=$(curl -sL -A "solar-dashboard (personal home dashboard)" -o body --max-time 40 -w '%{http_code} %{content_type}' "$u" || echo "fail")
            { echo "URL: $u"; echo "STATUS: $code"; echo "BYTES: $(wc -c < body 2>/dev/null)"; echo; head -c 400000 body 2>/dev/null; } > "$i.txt"
            rm -f body
          done
          git init -q && git checkout -q -b probe
          git config user.name "probe" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "probe"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe

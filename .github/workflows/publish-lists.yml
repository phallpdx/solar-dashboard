name: Publish researched lists

# The daily research runs can only push to claude/* branches. This copies just
# their list files onto main, after checking each one is valid JSON.
on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

concurrency:
  group: publish-lists
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Copy list files from the pushed branch
        env:
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch origin "$BRANCH"
          # Only copy lists this push actually changed. A branch that merely carries an older copy of a
          # list (a code branch, say) must never roll main back to it.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE=$(git merge-base origin/main "origin/$BRANCH")
          fi
          touched=$(git diff --name-only "$BEFORE" "origin/$BRANCH" -- web/)
          echo "Lists touched by this push: $touched"
          changed=""
          for f in concerts restaurants liquor localmusic coast teams bluray kids events planahead skioutlook foodfinds jazz marketbrief localstatus; do
            path="web/$f.json"
            if echo "$touched" | grep -qx "$path" && git cat-file -e "origin/$BRANCH:$path" 2>/dev/null; then
              git show "origin/$BRANCH:$path" > "/tmp/$f.json"
              if python3 -m json.tool "/tmp/$f.json" > /dev/null && ! cmp -s "/tmp/$f.json" "$path"; then
                cp "/tmp/$f.json" "$path"
                changed="$changed $f"
              fi
            fi
          done
          if [ -z "$changed" ]; then echo "Nothing new"; exit 0; fi
          git config user.name "solar-dashboard bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/*.json
          git commit -m "Update lists:$changed (from $BRANCH)"
          git push origin main

name: Update dashboard

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 min; each source has its own pace, and APsystems is held to about one call an hour
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Cached API responses, call counts and PGE files live on the "data" branch.
      - name: Get saved data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone --quiet --depth 1 --branch data \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          else
            mkdir -p data && git -C data init --quiet
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch solar, weather and PGE data
        env:
          APSYSTEMS_APP_ID: ${{ secrets.APSYSTEMS_APP_ID }}
          APSYSTEMS_APP_SECRET: ${{ secrets.APSYSTEMS_APP_SECRET }}
          APSYSTEMS_SID: ${{ secrets.APSYSTEMS_SID }}
          AMBIENT_API_KEY: ${{ secrets.AMBIENT_API_KEY }}
          AMBIENT_APP_KEY: ${{ secrets.AMBIENT_APP_KEY }}
          HOME_ADDRESS: ${{ secrets.HOME_ADDRESS }}
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          PLACES: ${{ secrets.PLACES }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          EBIRD_KEY: ${{ secrets.EBIRD_KEY }}
          GOOGLE_POLLEN_KEY: ${{ secrets.GOOGLE_POLLEN_KEY }}
          CALENDAR_ICS: ${{ secrets.CALENDAR_ICS }}
          CONGRESS_KEY: ${{ secrets.CONGRESS_KEY }}
          OPENSTATES_KEY: ${{ secrets.OPENSTATES_KEY }}
          GOOGLE_CIVIC_KEY: ${{ secrets.GOOGLE_CIVIC_KEY }}
          NASA_KEY: ${{ secrets.NASA_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GOODREADS_USER: ${{ secrets.GOODREADS_USER }}
          PGE_CYCLE_START_DAY: ${{ vars.PGE_CYCLE_START_DAY }}
          DATA_DIR: data
        run: |
          pip install --quiet tzdata websockets sgp4
          python -m solar.update

      # Recordings of the Thai phrases. Made once each (about 80 short clips), then kept on the data branch.
      - name: Record Thai phrases
        continue-on-error: true
        env:
          DATA_DIR: data
        run: python -m solar.thai_audio --check || { pip install --quiet edge-tts && python -m solar.thai_audio; }

      - name: Build site
        run: |
          mkdir -p _site
          cp web/* _site/
          cp data/dashboard.json _site/
          # One pass over everything the page shows: one value per fact, each item once, nothing stale.
          python -m solar.integrity _site || echo "integrity pass failed; building from the raw data"
          if [ -d data/thai ]; then cp -r data/thai _site/; fi

      # What each section shows today, saved once a day per section (data/freshness.json) so the page can put
      # the sections with the most new items first. Uses the Chrome GitHub's runners already have.
      # The Kindle editions (solar/kindle*.py, solar/art_raster.py) are retired and no longer built.
      - name: Note what's new in each section
        continue-on-error: true
        timeout-minutes: 4
        run: |
          pip install --quiet playwright
          python -m solar.freshness _site data/freshness.json

      - name: Save data
        working-directory: data
        run: |
          git config user.name "solar-dashboard bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --quiet --orphan snapshot
          git add -A
          git commit --quiet -m "Data as of $(date -u +%FT%TZ)"
          # GitHub sometimes answers a push with a 500. Try again a few times before calling the run failed.
          for wait in 5 15 30 60 0; do
            git push --quiet --force \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshot:data && exit 0
            [ "$wait" = 0 ] && exit 1
            echo "Push failed, trying again in ${wait}s"; sleep "$wait"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true # data still updates while Pages is not turned on yet

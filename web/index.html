<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Home energy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5F1;--card:#FFFFFF;--line:#E4E2DC;--grid:#EEECE7;--axis:#D9D6CF;--ink:#15171C;--muted:#5E636E;--body:#3D414A;--soft:#C9CBD1;--solar:#F5A524;--use:#2563EB;--sun:#8A8F99}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding:40px 24px 56px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
h1{margin:4px 0 0;font-size:34px;font-weight:800;letter-spacing:-.025em}
h2{margin:0;font-size:17px;font-weight:700}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{min-height:40px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:600 14px Manrope,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.tile.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.tile .k,.tile .s{font-size:13px;font-weight:600;color:var(--muted)}
.tile.dark .k,.tile.dark .s,.tile.dark .u{color:var(--soft)}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.u{font-size:18px;font-weight:600;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.wide{flex:999 1 560px}.side{flex:1 1 300px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;font-weight:600;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px}
.axis{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted)}
.note{margin:0;font-size:13px;line-height:1.5;color:var(--body)}
.meta{font-size:12px;font-weight:600;color:var(--muted)}
.bars{height:200px;display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--axis)}
.bars>div{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;gap:1px}
.bars i{flex:1 1 0;border-radius:3px 3px 0 0;min-height:1px}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.mini .k{font-size:12px;font-weight:600;color:var(--muted)}
.mini .v{font-size:18px;font-weight:800}
.mini .v small{font-size:12px;font-weight:600;color:var(--muted)}
.lines>div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--grid);font-size:14px}
.lines>div:last-child{border-bottom:0}
.lines span:first-child{color:var(--body)}.lines span:last-child{font-weight:700}
.progress{height:10px;border-radius:999px;background:var(--grid);overflow:hidden}
.progress div{height:100%;background:var(--ink);border-radius:999px}
.panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.panel{border-radius:8px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent}
.panel.low{background:#fff;border:2px dashed var(--ink)}
.panel b{font-size:13px;font-weight:800}.panel span{font-size:11px;font-weight:600;color:var(--body)}
.empty{padding:18px;border:1px dashed var(--axis);border-radius:16px;font-size:14px;line-height:1.5;color:var(--body)}
.banner{background:#FFF7E6;border:1px solid #F3D9A4;border-radius:16px;padding:12px 16px;font-size:14px;line-height:1.5;color:#5A4210}
.chart{position:relative}
.chart svg{width:100%;height:262px;display:block}
@media (max-width:600px){.wrap{padding:24px 16px 40px}h1{font-size:28px}.big{font-size:34px}.seg button{padding:0 14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="eyebrow" id="stamp">Loading…</div><h1>Home energy</h1></div>
    <div class="seg" role="group" aria-label="Time range">
      <button data-range="day" aria-pressed="true">Day</button>
      <button data-range="week" aria-pressed="false">Week</button>
      <button data-range="month" aria-pressed="false">Month</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>

  <section class="tiles" aria-label="Right now">
    <div class="tile dark"><span class="k">Producing now</span><span class="big" id="t-now">–</span><span class="s" id="t-now-s"></span></div>
    <div class="tile"><span class="k" id="t-today-k">Produced today</span><span class="big" id="t-today">–</span><span class="s" id="t-today-s"></span></div>
    <div class="tile"><span class="k">Panels vs. sunlight</span><span class="big" id="t-perf">–</span><span class="s" id="t-perf-s"></span></div>
    <div class="tile"><span class="k">PG&amp;E this cycle</span><span class="big" id="t-bill">–</span><span class="s" id="t-bill-s"></span></div>
  </section>

  <div class="row">
    <section class="card wide" aria-labelledby="main-h">
      <div class="head"><h2 id="main-h">Power through the day</h2><div class="legend" id="main-legend"></div></div>
      <div class="chart" id="main-chart"></div>
      <div class="axis" id="main-axis"></div>
    </section>
    <section class="card side" aria-labelledby="wx-h">
      <div class="head"><h2 id="wx-h">Weather at home</h2><span class="meta" id="wx-meta"></span></div>
      <div id="wx"></div>
    </section>
  </div>

  <div class="row">
    <section class="card wide" aria-labelledby="mo-h">
      <div class="head"><h2 id="mo-h">Last 30 days</h2>
        <div class="legend"><span><i class="sw" style="background:var(--solar)"></i>Produced</span><span id="used-legend"><i class="sw" style="background:var(--use)"></i>Used (PG&amp;E meter)</span></div>
      </div>
      <div id="month-chart"></div>
      <div class="axis" id="month-axis"></div>
      <p class="note" id="month-note"></p>
    </section>
    <section class="card side" aria-labelledby="bill-h">
      <div class="head"><h2 id="bill-h">PG&amp;E bill cycle</h2><span class="meta" id="bill-meta"></span></div>
      <div id="bill"></div>
    </section>
  </div>

  <section class="card" aria-labelledby="pn-h">
    <div class="head"><h2 id="pn-h">Panels right now</h2><span class="meta" id="pn-meta" style="font-size:13px"></span></div>
    <div class="panels" id="panels"></div>
  </section>
  <p class="meta" id="foot" style="margin:0"></p>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = iso => { const [y,m,d] = iso.split('-').map(Number); return `${MON[m-1]} ${d}`; };
const n1 = x => (Math.round(x * 10) / 10).toFixed(1);
const money = x => (x < 0 ? '−$' : '$') + Math.abs(x).toFixed(2);
const mins = t => { const [h, m] = t.split(' ').pop().split(':').map(Number); return h * 60 + m; };
const hourLabel = m => { const h = Math.floor(m / 60) % 24; return (h % 12 || 12) + (h < 12 ? ' am' : ' pm'); };
let D, range = 'day';

async function load() {
  for (const url of ['dashboard.json', 'sample.json']) {
    try {
      const r = await fetch(url + '?t=' + Date.now());
      if (!r.ok) continue;
      const d = await r.json();
      if (url === 'sample.json' || d.solar) return d;
      D = d; // real file without solar yet: keep its status for the banner
    } catch (e) {}
  }
}

function render() {
  const s = D.solar, w = D.weather, b = D.bill, sample = D.sample;
  const gen = new Date(D.generated_at);
  $('stamp').textContent = gen.toLocaleDateString(undefined, {weekday:'long', month:'short', day:'numeric'}) +
    ' · updated ' + gen.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'}) + (sample ? ' · Sample data' : '');

  const problems = Object.entries(D.status || {}).filter(([k, v]) => k === 'solar' && v !== 'ok');
  if (sample && D.realStatus) problems.push(['solar', D.realStatus]);
  $('banner').hidden = !problems.length;
  $('banner').textContent = problems.map(([, v]) => 'Solar: ' + v).join(' ');

  // Tiles
  if (s) {
    $('t-now').innerHTML = `${n1(s.now_kw)} <span class="u">kW</span>`;
    const m = s.as_of ? mins(s.as_of) : null;
    const asOf = m == null ? '' : `${(Math.floor(m / 60) % 12) || 12}:${String(m % 60).padStart(2, '0')} ${m < 720 ? 'am' : 'pm'}`;
    $('t-now-s').textContent = s.as_of ? `As of ${asOf}` + (s.capacity_kw ? ` · ${s.capacity_kw} kW system` : '') : 'No reading yet today';
    $('t-today').innerHTML = `${n1(s.today_kwh)} <span class="u">kWh</span>`;
    $('t-today-s').textContent = s.pace_kwh ? `On pace for about ${Math.round(s.pace_kwh)} kWh` : `This month ${Math.round(s.summary.month)} kWh`;
  }
  const p = D.performance;
  if (p && p.pct != null) {
    $('t-perf').innerHTML = `${p.pct}<span class="u">%</span>`;
    $('t-perf-s').textContent = 'Of what today’s sun should give';
  } else {
    $('t-perf').innerHTML = '<span class="u">–</span>';
    $('t-perf-s').textContent = w ? `Learning your system (${p ? p.baseline_days : 0} of 5 days)` : 'Needs your weather station';
  }
  if (b && b.cost != null) {
    $('t-bill').textContent = (b.cost < 0 ? '−$' : '$') + Math.round(Math.abs(b.cost));
    $('t-bill-s').textContent = `${b.cost < 0 ? 'Credit' : 'Owed'} so far · bill closes ${fmtDate(b.cycle_end)}`;
  } else if (b) {
    $('t-bill').innerHTML = `${b.imported_kwh} <span class="u">kWh</span>`;
    $('t-bill-s').textContent = 'Bought from grid this cycle';
  } else {
    $('t-bill').innerHTML = '<span class="u">–</span>';
    $('t-bill-s').textContent = 'Needs a PG&E download';
  }

  renderMain();
  renderWeather();
  renderMonth();
  renderBill();
  renderPanels();
  $('foot').textContent = sample ? 'Showing sample numbers until your system’s data arrives.' :
    `APsystems calls this month: ${s ? s.calls_this_month : 0}. Updates about once an hour.`;
}

function renderMain() {
  const s = D.solar, w = D.weather;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.range === range));
  if (range !== 'day') {
    const n = range === 'week' ? 7 : 30;
    $('main-h').textContent = range === 'week' ? 'Last 7 days' : 'Last 30 days';
    $('main-legend').innerHTML = '<span><i class="sw" style="background:var(--solar)"></i>Produced</span>';
    const days = D.days.slice(-n);
    const max = Math.max(1, ...days.map(d => d.produced || 0));
    $('main-chart').innerHTML = `<div class="bars" style="height:262px" role="img" aria-label="Daily production for the last ${n} days">` +
      days.map(d => `<div title="${fmtDate(d.date)}: ${d.produced == null ? 'no data' : n1(d.produced) + ' kWh'}"><i style="background:var(--solar);height:${(d.produced || 0) / max * 100}%"></i></div>`).join('') + '</div>';
    $('main-axis').innerHTML = [0, Math.floor(n / 2), n - 1].map(i => `<span>${fmtDate(days[i].date)}</span>`).join('');
    return;
  }
  $('main-h').textContent = 'Power through the day';
  const hasSun = w && w.curve && w.curve.length;
  $('main-legend').innerHTML = '<span><i class="sw" style="background:var(--solar)"></i>Solar</span>' +
    (hasSun ? '<span><i style="width:14px;border-top:2px dashed var(--sun)"></i>Sunlight (Ambient)</span>' : '');
  const pts = (s && s.curve) || [];
  if (!pts.length) {
    $('main-chart').innerHTML = '<div class="empty">No production yet today. The chart fills in once the panels wake up.</div>';
    $('main-axis').innerHTML = '';
    return;
  }
  const W = 760, H = 262, base = 240, top = 20, start = 5 * 60, end = 21 * 60;
  const x = m => (Math.min(Math.max(m, start), end) - start) / (end - start) * W;
  const maxKw = Math.max(s.capacity_kw || 0, ...pts.map(p => p.kw)) * 1.05 || 1;
  const y = kw => base - kw / maxKw * (base - top);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(mins(p.t)).toFixed(1)} ${y(p.kw).toFixed(1)}`).join(' ');
  const lastX = x(mins(pts[pts.length - 1].t)).toFixed(1);
  const area = `${line} L${lastX} ${base} L${x(mins(pts[0].t)).toFixed(1)} ${base} Z`;
  let sun = '';
  if (hasSun) {
    const maxW = Math.max(1000, ...w.curve.map(c => c.wm2));
    sun = `<path d="${w.curve.map((c, i) => `${i ? 'L' : 'M'}${x(mins(c.t)).toFixed(1)} ${(base - c.wm2 / maxW * (base - top)).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--sun)" stroke-width="2" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>`;
  }
  const peak = pts.reduce((a, b) => b.kw > a.kw ? b : a);
  const grid = [90, 165].map(g => `<line x1="0" y1="${g}" x2="${W}" y2="${g}" stroke="var(--grid)" vector-effect="non-scaling-stroke"/>`).join('');
  $('main-chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Solar power today, peaking at ${n1(peak.kw)} kW around ${hourLabel(mins(peak.t))}">
    ${grid}<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--axis)" vector-effect="non-scaling-stroke"/>
    <path d="${area}" fill="var(--solar)" fill-opacity="0.85"/>${sun}
    <line x1="${lastX}" y1="${top}" x2="${lastX}" y2="${base}" stroke="var(--ink)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/></svg>`;
  $('main-axis').innerHTML = [5, 9, 13, 17, 21].map(h => `<span>${hourLabel(h * 60)}</span>`).join('');
}

function renderWeather() {
  const w = D.weather;
  if (!w) {
    $('wx-meta').textContent = '';
    $('wx').innerHTML = '<div class="empty">Connect your Ambient Weather station to see sunlight, temperature and how weather affects your panels.</div>';
    return;
  }
  const ago = w.updated_ms ? Math.max(0, Math.round((Date.now() - w.updated_ms) / 60000)) : null;
  $('wx-meta').textContent = esc(w.station) + (ago != null ? ` · ${ago < 60 ? ago + ' min' : Math.round(ago / 60) + ' hr'} ago` : '');
  const hilo = w.hi_f != null ? `High ${w.hi_f}° · low ${w.lo_f}°` : '';
  const note = w.heat_loss_pct == null ? 'Not much sun right now, so heat isn’t costing you anything.'
    : w.heat_loss_pct <= 4 ? `Panels are running cool, so heat is costing only about ${w.heat_loss_pct}% right now.`
    : `Hot panels lose output. Heat is costing about ${w.heat_loss_pct}% right now.`;
  $('wx').innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;gap:14px">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <div style="display:flex;flex-direction:column"><span class="big" style="line-height:1">${w.temp_f}°F</span><span class="meta" style="font-size:13px">${hilo}</span></div>
    </div>
    <div class="minis">
      <div class="mini"><span class="k">Sunlight</span><span class="v">${w.sun_wm2} <small>W/m²</small></span></div>
      <div class="mini"><span class="k">UV index</span><span class="v">${w.uv ?? '–'}</span></div>
      <div class="mini"><span class="k">Humidity</span><span class="v">${w.humidity ?? '–'}<small>%</small></span></div>
      <div class="mini"><span class="k">Wind</span><span class="v">${w.wind_mph} <small>mph ${esc(w.wind_dir)}</small></span></div>
    </div>
    <p class="note">${note}</p></div>`;
}

function renderMonth() {
  const days = D.days;
  const hasUse = days.some(d => d.used != null);
  $('used-legend').style.display = hasUse ? '' : 'none';
  const max = Math.max(1, ...days.map(d => Math.max(d.produced || 0, d.used || 0)));
  $('month-chart').innerHTML = `<div class="bars" role="img" aria-label="Daily production${hasUse ? ' and use' : ''} for the last 30 days">` +
    days.map(d => `<div title="${fmtDate(d.date)}: ${d.produced == null ? 'no data' : n1(d.produced) + ' kWh made'}${d.used != null ? ', ' + n1(d.used) + ' kWh used' : ''}">
      <i style="background:var(--solar);height:${(d.produced || 0) / max * 100}%"></i>${hasUse ? `<i style="background:var(--use);height:${(d.used || 0) / max * 100}%"></i>` : ''}</div>`).join('') + '</div>';
  $('month-axis').innerHTML = [0, 9, 19, 29].map(i => `<span>${fmtDate(days[i].date)}</span>`).join('');
  const low = D.low_days || [];
  let note;
  if (!low.length) note = 'No unusually low days this month. Production looks steady.';
  else {
    const list = low.map(l => fmtDate(l.date)).join(', ');
    const cloudy = low.filter(l => l.cloudy).length;
    note = `Low days: ${list}. ` + (!D.weather ? 'Connecting your weather station will show whether clouds explain them.'
      : cloudy === low.length ? 'They match cloudy readings from your weather station, so the system is fine.'
      : 'Not all of them were cloudy at your station, so they may be worth a look.');
  }
  $('month-note').textContent = note;
}

function renderBill() {
  const b = D.bill;
  if (!b) {
    $('bill-meta').textContent = '';
    $('bill').innerHTML = '<div class="empty">Upload a PG&amp;E “Green Button” download to see what you bought, what you sent back, and your running balance.</div>';
    return;
  }
  const pct = Math.min(100, Math.round(b.cycle_day / b.cycle_days * 100));
  $('bill-meta').textContent = `${fmtDate(b.cycle_start)} – ${fmtDate(b.cycle_end)}`;
  const rows = [['Bought from grid', `${b.imported_kwh} kWh`], ['Sent to grid', `${b.exported_kwh} kWh`]];
  if (b.peak_kwh != null) rows.push(['Peak-hour use (4–9 pm)', `${b.peak_kwh} kWh`]);
  if (b.cost != null) rows.push(['Estimated balance', money(b.cost)]);
  let note = `PG&E data runs through ${fmtDate(b.data_through)}.`;
  if (b.peak_share != null && b.peak_share >= 0.5) note = `About ${Math.round(b.peak_share * 100)}% of what you buy is 4–9 pm, the priciest hours. Shifting laundry or dishes earlier would help. ` + note;
  $('bill').innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
    <div class="progress"><div style="width:${pct}%"></div></div>
    <span class="meta" style="margin-top:-6px">Day ${Math.min(b.cycle_day, b.cycle_days)} of ${b.cycle_days}${b.cycle_explicit ? '' : ' (assumed cycle)'}</span>
    <div class="lines">${rows.map(r => `<div><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div>
    <p class="note">${esc(note)}</p></div>`;
}

function renderPanels() {
  const panels = (D.solar && D.solar.panels) || [];
  if (!panels.length) {
    $('pn-meta').textContent = '';
    $('panels').innerHTML = '<div class="empty" style="grid-column:1/-1">Panel readings show up once your system reports today.</div>';
    return;
  }
  const score = p => p.kwh ?? p.w;
  const max = Math.max(0.01, ...panels.map(score));
  const dead = panels.filter(p => p.dead), low = panels.filter(p => p.low && !p.dead);
  const ids = list => list.map(p => p.id).join(', ');
  $('pn-meta').textContent = `${panels.length} panels` +
    (dead.length ? ` · ${dead.length} made nothing today (${ids(dead)})` : '') +
    (low.length ? ` · ${low.length} running low (${ids(low)})` : '') +
    (!dead.length && !low.length ? ' · all looking even' : '');
  $('panels').innerHTML = panels.map(p => {
    const a = Math.round(40 + score(p) / max * 60);
    const bg = p.low ? '' : `background:color-mix(in srgb, var(--solar) ${a}%, #FFFFFF)`;
    return `<div class="panel${p.low ? ' low' : ''}" style="${bg}" title="${p.id}: ${p.kwh != null ? p.kwh + ' kWh today' : ''}"><span>${p.id}</span><b>${p.w}W</b></div>`;
  }).join('');
}

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { range = b.dataset.range; renderMain(); }));

(async () => {
  const realStatus = D && D.status && D.status.solar;
  const d = await load();
  if (!d && !D) { $('stamp').textContent = 'Couldn’t load data'; return; }
  const status = D && D.status ? D.status.solar : null;
  D = d || D;
  if (D.sample && status && status !== 'ok') D.realStatus = status;
  render();
  setInterval(async () => { const n = await load(); if (n && !n.sample) { D = n; render(); } }, 15 * 60 * 1000);
})();
</script>
